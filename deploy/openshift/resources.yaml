apiVersion: v1
kind: Namespace
metadata:
  name: cost-aware-inference-demo
  labels:
    app.kubernetes.io/part-of: cost-aware-inference-demo
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: presentation
  namespace: cost-aware-inference-demo
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: proof-api
  namespace: cost-aware-inference-demo
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: presentation
  namespace: cost-aware-inference-demo
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: presentation:latest
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: proof-api
  namespace: cost-aware-inference-demo
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: proof-api:latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-api-config
  namespace: cost-aware-inference-demo
data:
  QUALIFICATION_ENVIRONMENT_ID: intel-reference
  QUALIFICATION_ENVIRONMENT_LABEL: Intel Xeon + Gaudi 3 reference environment
  QUALIFICATION_FRAMEWORK_REVISION: not_recorded
  QUALIFICATION_PLATFORM_JSON: >-
    {"openshift":"deployment-provided","openshift_ai":"deployment-provided","red_hat_ai_inference":"deployment-provided","identity_source":"declared"}
  QUALIFICATION_RESOURCE_PROFILE_JSON: >-
    {"cpu_endpoint":{"requests":{"cpu":"32","memory":"64Gi"},"limits":{"cpu":"32","memory":"64Gi"}},"accelerator_endpoint":{"requests":{"cpu":"8","memory":"32Gi","accelerator":"1"},"limits":{"cpu":"16","memory":"64Gi","accelerator":"1"}},"semantic_router":{"requests":{"cpu":"250m","memory":"512Mi"},"limits":{"cpu":"2","memory":"2Gi"}},"mcp_gateway":{"requests":{"cpu":"50m","memory":"64Mi"},"limits":{"cpu":"250m","memory":"256Mi"}},"proof_api":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"cpu":"1","memory":"512Mi"}}}
  DEFAULT_CPU_MODEL: qwen25-3b-cpu
  DEFAULT_ACCELERATOR_MODEL: gaudi-llama-31-8b
  CPU_MODEL_ENDPOINTS_JSON: >-
    {"qwen25-3b-cpu":{"label":"Qwen 2.5 3B Instruct · Xeon","base_url":"http://qwen25-3b-cpu-predictor:8080","provider":"Intel Xeon CPU (declared by the OpenShift AI hardware profile)","runtime":"Red Hat AI Inference vLLM CPU runtime","vendor":"intel","product":"Xeon","identity_source":"declared","support_status":"supported","target_id":"openshift-ai-cpu"}}
  ACCELERATOR_MODEL_ENDPOINTS_JSON: >-
    {"gaudi-llama-31-8b":{"label":"Llama 3.1 8B · Gaudi 3","base_url":"http://gaudi-llama-31-8b-predictor:8080","provider":"Intel Gaudi 3 accelerator (observed by OpenShift device allocation)","runtime":"Red Hat AI Inference vLLM Gaudi runtime","vendor":"intel","product":"Gaudi 3","identity_source":"observed","support_status":"technology_preview","target_id":"openshift-ai-gaudi"},"gaudi-granite-31-8b":{"label":"Granite 3.1 8B LAB · Gaudi 3","base_url":"http://gaudi-granite-31-8b-predictor:8080","provider":"Intel Gaudi 3 accelerator (observed by OpenShift device allocation)","runtime":"Red Hat AI Inference vLLM Gaudi runtime","vendor":"intel","product":"Gaudi 3","identity_source":"observed","support_status":"technology_preview","target_id":"openshift-ai-gaudi"}}
  CPU_API_BASE: http://qwen25-3b-cpu-predictor:8080
  CPU_CLASSIFY_MODEL: qwen25-3b-cpu
  CPU_NER_MODEL: qwen25-3b-cpu
  CPU_SUMMARY_MODEL: qwen25-3b-cpu
  CPU_HARDWARE_PROVIDER: Intel Xeon CPU (declared by the OpenShift AI hardware profile)
  CPU_INFERENCE_RUNTIME: Red Hat AI Inference vLLM CPU runtime
  INFERENCE_TLS_VERIFY: "true"
  GPU_API_BASE: http://gaudi-llama-31-8b-predictor:8080
  GPU_MODEL: gaudi-llama-31-8b
  GPU_HARDWARE_PROVIDER: Intel Gaudi 3 accelerator (observed by OpenShift device allocation)
  GPU_INFERENCE_RUNTIME: Red Hat AI Inference vLLM Gaudi runtime
  SEMANTIC_ROUTER_URL: http://semantic-router:8094
  MCP_GATEWAY_URL: http://mcp-gateway:8091
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-router-config
  namespace: cost-aware-inference-demo
data:
  routes.yaml: |
    version: "cost-aware-1.0"
    scoring:
      weights: { embedding_max: 0.7, embedding_avg: 0.3 }
      confidence_cap: 0.99
      word_count_thresholds: { complex: 80, medium: 40 }
    embedding: { model: all-MiniLM-L6-v2 }
    heterogeneous:
      enabled: true
      gpu_model: gaudi-llama-31-8b
      escalation_routes: [complex]
    routes:
      - name: simple
        model: qwen25-3b-cpu
        anchors: ["Classify one clinical document", "Label a record", "Choose one category"]
        keywords: [classify, label, category]
      - name: medium
        model: qwen25-3b-cpu
        anchors: ["Extract medications as structured JSON", "List entities from a clinical document"]
        keywords: [extract, list, structured]
      - name: complex
        model: gaudi-llama-31-8b
        anchors: ["Synthesize clinical findings and risks into a physician handoff", "Reason across evidence and draft a final answer"]
        keywords: [synthesize, reasoning, handoff, draft]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-router
  namespace: cost-aware-inference-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: semantic-router }
  template:
    metadata:
      labels: { app: semantic-router }
    spec:
      containers:
        - name: semantic-router
          image: quay.io/redhat-gpte/triforce-semantic-router@sha256:b1fb0bdd5dc35510402d5a32ea24856e6a2c8ee91ba66598ce3caf67fa1ad58f
          imagePullPolicy: Always
          env:
            - { name: SEMANTIC_ROUTER_PORT, value: "8094" }
            - { name: HETEROGENEOUS_ROUTING, value: "true" }
            - { name: GPU_COMPLEX_MODEL, value: gaudi-llama-31-8b }
            - { name: ROUTES_CONFIG, value: /app/config/routes.yaml }
          volumeMounts:
            - { name: config, mountPath: /app/config, readOnly: true }
          ports:
            - { name: http, containerPort: 8094 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: config
          configMap: { name: semantic-router-config }
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-router
  namespace: cost-aware-inference-demo
spec:
  selector: { app: semantic-router }
  ports:
    - { name: http, port: 8094, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: cost-aware-inference-demo
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: cost-aware-inference-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-gateway }
  template:
    metadata:
      labels: { app: mcp-gateway }
    spec:
      containers:
        - name: gateway
          image: quay.io/redhat-gpte/triforce-mcp-gateway@sha256:7ed44ace3a213c32966c552dab21d3abf3ce5d157265bce47a26ce77dd74e862
          ports:
            - { name: http, containerPort: 8091 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: cost-aware-inference-demo
spec:
  selector: { app: mcp-gateway }
  ports:
    - { name: http, port: 8091, targetPort: http }
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cpu-runtime
  namespace: cost-aware-inference-demo
  annotations:
    opendatahub.io/runtime-version: v0.24.0
    openshift.io/display-name: vLLM CPU ServingRuntime for KServe
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cpu-rhel9@sha256:578e9946e60a14596185937f6a083c1d42f3cff343b18648090b9ac80691d2e0
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args: [--port=8080, --model=/mnt/models, '--served-model-name={{.Name}}']
      env:
        - { name: HF_HOME, value: /tmp/hf_home }
      ports:
        - { containerPort: 8080, protocol: TCP }
  multiModel: false
  supportedModelFormats:
    - { name: vLLM, autoSelect: false }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-3b-cpu
  namespace: cost-aware-inference-demo
  annotations:
    openshift.io/display-name: Qwen 2.5 3B Instruct CPU
    opendatahub.io/hardware-profile-name: xeon-small
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat: { name: vLLM }
      runtime: vllm-cpu-runtime
      storageUri: hf://Qwen/Qwen2.5-3B-Instruct
      args: [--dtype=bfloat16, --enforce-eager, --enable-prefix-caching, --max-model-len=4096, --max-num-seqs=16]
      env:
        - { name: VLLM_CPU_KVCACHE_SPACE, value: "8" }
        - { name: VLLM_CPU_NUM_OF_RESERVED_CPU, value: "1" }
      resources:
        requests: { cpu: "32", memory: 64Gi }
        limits: { cpu: "32", memory: 64Gi }
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }
    volumes:
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-gaudi-runtime
  namespace: cost-aware-inference-demo
  annotations:
    opendatahub.io/recommended-accelerators: '["habana.ai/gaudi"]'
    opendatahub.io/runtime-version: v0.24.0
    openshift.io/display-name: vLLM Intel Gaudi Accelerator ServingRuntime for KServe
  labels:
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  builtInAdapter:
    modelLoadingTimeoutMillis: 90000
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-gaudi-rhel9@sha256:f44bd360c45f3cd025491cfe608514263a1d00f8a6a5b6cc7ef9df31da749efd
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args: [--port=8080, --model=/mnt/models, '--served-model-name={{.Name}}']
      env:
        - { name: HF_HOME, value: /tmp/hf_home }
      ports:
        - { containerPort: 8080, protocol: TCP }
  multiModel: false
  supportedModelFormats:
    - { name: vLLM, autoSelect: false }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gaudi-llama-31-8b
  namespace: cost-aware-inference-demo
  annotations:
    openshift.io/display-name: Gaudi Llama 3.1 8B
    opendatahub.io/hardware-profile-name: intel-gaudi
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat: { name: vLLM }
      runtime: vllm-gaudi-runtime
      storageUri: oci://registry.redhat.io/rhelai1/modelcar-llama-3-1-8b-instruct:1.5
      args: [--dtype=bfloat16, --max-model-len=4096, --max-num-seqs=16]
      resources:
        requests: { cpu: "8", memory: 32Gi, habana.ai/gaudi: "1" }
        limits: { cpu: "16", memory: 64Gi, habana.ai/gaudi: "1" }
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }
        - { name: habana-logs, mountPath: /var/log/habana_logs }
    volumes:
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
      - name: habana-logs
        emptyDir: {}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: gaudi-granite-31-8b
  namespace: cost-aware-inference-demo
  annotations:
    openshift.io/display-name: Gaudi Granite 3.1 8B LAB
    opendatahub.io/hardware-profile-name: intel-gaudi
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat: { name: vLLM }
      runtime: vllm-gaudi-runtime
      storageUri: oci://registry.redhat.io/rhelai1/modelcar-granite-3-1-8b-lab-v2:1.5-1747378709
      args: [--dtype=bfloat16, --max-model-len=4096, --max-num-seqs=16]
      resources:
        requests: { cpu: "8", memory: 32Gi, habana.ai/gaudi: "1" }
        limits: { cpu: "16", memory: 64Gi, habana.ai/gaudi: "1" }
      volumeMounts:
        - { name: shm, mountPath: /dev/shm }
        - { name: habana-logs, mountPath: /var/log/habana_logs }
    volumes:
      - name: shm
        emptyDir: { medium: Memory, sizeLimit: 8Gi }
      - name: habana-logs
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proof-api
  namespace: cost-aware-inference-demo
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"proof-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"proof-api\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels: { app: proof-api }
  template:
    metadata:
      labels: { app: proof-api }
    spec:
      containers:
        - name: proof-api
          image: image-registry.openshift-image-registry.svc:5000/cost-aware-inference-demo/proof-api:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: { name: proof-api-config }
            - secretRef: { name: proof-api-secrets, optional: true }
          ports:
            - { name: http, containerPort: 8090 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: proof-api
  namespace: cost-aware-inference-demo
spec:
  selector: { app: proof-api }
  ports:
    - { name: http, port: 8090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presentation
  namespace: cost-aware-inference-demo
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"presentation:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"presentation\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels: { app: presentation }
  template:
    metadata:
      labels: { app: presentation }
    spec:
      containers:
        - name: presentation
          image: image-registry.openshift-image-registry.svc:5000/cost-aware-inference-demo/presentation:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: presentation
  namespace: cost-aware-inference-demo
spec:
  selector: { app: presentation }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cost-aware-inference
  namespace: cost-aware-inference-demo
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  to: { kind: Service, name: presentation }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
