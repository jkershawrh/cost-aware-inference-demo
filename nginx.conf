worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /fonts/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /logos/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400"; }
    location /proof/ {
      proxy_pass http://proof-api:8090/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
